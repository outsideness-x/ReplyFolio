project_id = "replyfolio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://127.0.0.1:5173"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = true
double_confirm_changes = true
otp_length = 8
otp_expiry = 600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.instagram-connect]
verify_jwt = false
[functions.instagram-callback]
verify_jwt = false
[functions.instagram-webhook]
verify_jwt = false
[functions.automation-worker]
verify_jwt = false
[functions.workspace-api]
verify_jwt = false
[functions.auth]
verify_jwt = false

# Cabinet endpoints require the signed Pages gateway and a private MFA session.
# OAuth callback requires a bound browser proof; webhook/worker use separate secrets.
